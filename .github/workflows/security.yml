name: Security scans

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - name: Analyze application and desktop code
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'

  dependencies:
    name: Runtime dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install the locked dependency graph without executing package scripts
        run: npm ci --ignore-scripts
      - name: Gate high and critical runtime dependency advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Record the complete dependency audit, including build tooling
        if: always()
        continue-on-error: true
        run: npm audit --json > dependency-audit.json
      - name: Retain complete dependency audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit
          path: dependency-audit.json
          retention-days: 30
          if-no-files-found: warn
