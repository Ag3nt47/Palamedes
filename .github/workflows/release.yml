name: Desktop releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish installers and create the version tag after every platform smoke test passes
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            args: --win nsis --x64
          - platform: mac-universal
            runner: macos-latest
            args: --mac dmg zip --universal
          - platform: linux-x64
            runner: ubuntu-22.04
            args: --linux AppImage deb --x64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify package version and any release tag
        shell: bash
        run: node -e 'const p=require("./package.json"); if(!require("semver").valid(p.version)) throw new Error("package.json version must be valid semver"); if(process.env.GITHUB_REF_TYPE==="tag" && process.env.GITHUB_REF_NAME!=="v"+p.version) throw new Error("Release tag must match package.json version");'
      - run: npm test
      - run: npm run build
      - name: Build installers and updater metadata
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify universal macOS executable
        if: runner.os == 'macOS'
        run: lipo -verify_arch x86_64 arm64 release/mac-universal/Palamedes.app/Contents/MacOS/Palamedes
      - name: Smoke test the packaged Windows application
        if: runner.os == 'Windows'
        run: node scripts/smoke-desktop.mjs release/win-unpacked/Palamedes.exe
      - name: Smoke test the packaged macOS application
        if: runner.os == 'macOS'
        run: node scripts/smoke-desktop.mjs release/mac-universal/Palamedes.app/Contents/MacOS/Palamedes
      - name: Smoke test the packaged Linux application
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-desktop.mjs release/linux-unpacked/palamedes
      - name: Verify required release artifacts
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files = fs.readdirSync('release');
          const requirements = {
            'windows-x64': ['.exe', 'latest.yml', '.blockmap'],
            'mac-universal': ['.dmg', '.zip', 'latest-mac.yml'],
            'linux-x64': ['.AppImage', '.deb', 'latest-linux.yml'],
          }[process.env.PLATFORM];
          for (const expected of requirements) {
            if (!files.some(file => file.endsWith(expected))) throw new Error(`Missing ${expected} for ${process.env.PLATFORM}`);
          }
          NODE
      - name: Retain platform installers and update artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Palamedes-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 30
      - name: Retain native smoke diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke-failure-${{ matrix.platform }}
          path: release/desktop-smoke-failure-*.png
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish complete desktop release
    needs: build
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Derive release tag from the tested source
        id: release
        run: node -e 'const fs=require("fs"); fs.appendFileSync(process.env.GITHUB_OUTPUT,"tag=v"+require("./package.json").version+"\n");'
      - uses: actions/download-artifact@v4
        with:
          pattern: Palamedes-*
          merge-multiple: true
          path: release
      - name: Publish all platforms together
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          source_sha=$(git rev-parse HEAD)
          if [[ "$GITHUB_REF" != refs/tags/* ]] && ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA" >/dev/null
          fi
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          if [[ "$tag_sha" != "$source_sha" ]]; then
            echo "::error::The release tag already targets a different source commit. Bump package.json version; this workflow will not move an existing tag or replace its assets."
            exit 1
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              gh release create "$RELEASE_TAG" --verify-tag --target "$GITHUB_SHA" --draft --title "Palamedes ${RELEASE_TAG#v}" --generate-notes
            else
              gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --title "Palamedes ${RELEASE_TAG#v}" --generate-notes
            fi
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
