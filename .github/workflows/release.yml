name: Desktop releases

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            args: --win nsis --x64
          - platform: mac-universal
            runner: macos-latest
            args: --mac dmg zip --universal
          - platform: linux-x64
            runner: ubuntu-22.04
            args: --linux AppImage deb --x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify tag matches package version
        shell: bash
        run: node -e 'const p=require("./package.json"); if(process.env.GITHUB_REF_NAME!=="v"+p.version) throw new Error("Release tag must match package.json version");'
      - run: npm test
      - run: npm run build
      - name: Build installers and updater metadata
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify universal macOS executable
        if: runner.os == 'macOS'
        run: lipo -verify_arch x86_64 arm64 release/mac-universal/Palamedes.app/Contents/MacOS/Palamedes
      - name: Verify required release artifacts
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files = fs.readdirSync('release');
          const requirements = {
            'windows-x64': ['.exe', 'latest.yml', '.blockmap'],
            'mac-universal': ['.dmg', '.zip', 'latest-mac.yml'],
            'linux-x64': ['.AppImage', '.deb', 'latest-linux.yml'],
          }[process.env.PLATFORM];
          for (const expected of requirements) {
            if (!files.some(file => file.endsWith(expected))) throw new Error(`Missing ${expected} for ${process.env.PLATFORM}`);
          }
          NODE
      - name: Retain platform installers and update artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Palamedes-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish complete desktop release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Palamedes-*
          merge-multiple: true
          path: release
      - name: Publish all platforms together
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Palamedes ${GITHUB_REF_NAME#v}" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
